[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "firebird-driver==2.0.3",
    "pydantic-settings>=2.0",
    "python-escpos[usb]>=3.1",
    "sqlalchemy>=2.0,<2.2",
    "sqlalchemy-firebird==2.2.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "uvicorn[standard]>=0.38",
]

[tool.ruff.lint.per-file-ignores]
# database.py must run the macOS client-library shims before importing sqlalchemy.
"app/database.py" = ["E402"]
